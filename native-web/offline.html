<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Meme Us — Offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 32px; background: #fff8ec; color: #241b4d; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
      section { max-width: 320px; }
      img { width: 112px; height: 112px; border-radius: 26px; }
      h1 { margin: 18px 0 8px; }
      p { color: #6f6887; line-height: 1.5; }
      button { margin-top: 14px; min-height: 48px; padding: 0 24px; border: 2px solid #241b4d; border-radius: 16px; background: #ff5c8a; color: white; font: inherit; font-weight: 700; box-shadow: 3px 3px 0 #241b4d; }
    </style>
  </head>
  <body>
    <section>
      <img src="icon.png" alt="Meme Us" />
      <h1>You’re offline</h1>
      <p>Meme Us needs a connection to sync prompts and reveal both memes safely.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </section>
  </body>
</html>
